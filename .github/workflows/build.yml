name: build

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.15']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      # install all requirements. Note that the full requirements are installed separately
      # so the job does not fail if one of the packages cannot be installed. This allows
      # testing the package for newer python version even when some of the optional
      # packages are not yet available.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cat requirements_full.txt | sed -e '/^\s*#.*$/d' -e '/^\s*$/d' | xargs -I % sh -c "pip install % || true"
        pip install -r tests/requirements.txt

    - name: Install optional dependencies
      continue-on-error: true
      run: |
        pip install py-pde

    - name: Test with pytest
      env:
        NUMBA_WARNINGS: 1
        MPLBACKEND: agg
      run: |
        cd scripts
        ./tests_run.sh

    - name: Test types with mypy
      continue-on-error: true
      run: |
        python -m mypy --config-file pyproject.toml --pretty --package modelrunner
