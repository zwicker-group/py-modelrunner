name: Generate coverage report

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      # install all requirements. Note that the full requirements are installed separately
      # so the job does not fail if one of the packages cannot be installed. This allows
      # testing the package for newer python version even when some of the optional
      # packages are not yet available.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cat requirements_full.txt | sed -e '/^\s*#.*$/d' -e '/^\s*$/d' | xargs -I % sh -c "pip install % || true"
        pip install -r tests/requirements.txt

    - name: Generate coverage report
      run: |
        export MPLBACKEND="agg"
        export PYTHONPATH="${PYTHONPATH}:`pwd`"
        pytest --cov-config=pyproject.toml --cov-report xml:report_coverage.xml --cov=modelrunner tests/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./report_coverage.xml
        flags: unittests
        fail_ci_if_error: true
